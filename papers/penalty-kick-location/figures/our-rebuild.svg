<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-label="Our rebuild. Eight goal cells plotted by conversion and on-target rate given a miss, sized by shots. A dashed line has slope -3.13 from Model 1.">
