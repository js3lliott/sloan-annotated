  <text x="344" y="442" text-anchor="middle" fill="#5c564c" font-family="Helvetica, sans-serif" font-size="13">conversion rate</text>
  <text x="18" y="240" fill="#5c564c" font-family="Helvetica, sans-serif" font-size="13" transform="rotate(-90 18 240)">on-target given a miss</text>
